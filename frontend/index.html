<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fact Checker ULTIMATE | Multimodal Intelligence</title>
    
    <!-- Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-real: #10b981;
            --accent-fake: #ef4444;
            --accent-ai: #8b5cf6;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .outfit { font-family: 'Outfit', sans-serif; }

        /* Glassmorphism */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transition: var(--transition);
        }

        /* Tabs */
        .nav-pills .nav-link {
            color: var(--text-muted);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-pills .nav-link.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Inputs */
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: white;
            padding: 1rem;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            color: white;
        }

        /* Dropzone */
        .dropzone {
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            background: rgba(255,255,255,0.02);
            transition: var(--transition);
        }

        .dropzone:hover { border-color: var(--primary); background: rgba(99, 102, 241, 0.05); }

        /* Badge Area */
        #badge-to-capture {
            padding: 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Gauge Chart Container */
        .chart-container {
            width: 250px;
            height: 150px;
            margin: 0 auto;
        }

        /* Loading AI */
        .loader {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            z-index: 100;
            border-radius: 24px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 15px;
        }

        .ai-pulse {
            width: 50px; height: 50px;
            background: var(--primary);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 2rem;
        }

        @media (max-width: 992px) { .main-grid { grid-template-columns: 1fr; } }
        
        .source-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px;
            margin-top: 5px;
            border-left: 3px solid var(--primary);
        }

        .voice-btn.recording {
            background: var(--accent-fake) !important;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h1 class="fw-bold mb-0 outfit"><i class="fas fa-brain text-primary me-2"></i>Fact Checker <span class="text-primary">ULTIMATE</span></h1>
            <p class="text-muted mb-0">Multimodal AI Intelligence Platform</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-light rounded-pill px-4" onclick="toggleMode()">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </header>

    <div class="main-grid">
        <!-- LEFT: Inputs & Analysis -->
        <section>
            <div class="glass-card position-relative mb-4">
                <div class="loader" id="loading">
                    <div class="ai-pulse"></div>
                    <h5 class="outfit">Processing Intelligence...</h5>
                </div>

                <ul class="nav nav-pills mb-4 gap-2" id="pills-tab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-text"><i class="fas fa-align-left me-2"></i>Text</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-url"><i class="fas fa-link me-2"></i>URL</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-doc"><i class="fas fa-file-pdf me-2"></i>Document</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-image"><i class="fas fa-image me-2"></i>Image</button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    <!-- Text Tab -->
                    <div class="tab-pane fade show active" id="tab-text">
                        <div class="position-relative">
                            <textarea id="text-input" class="form-control mb-3" rows="6" placeholder="Enter claims to verify..."></textarea>
                            <button id="voice-btn" class="btn btn-primary position-absolute bottom-0 end-0 m-3 rounded-circle voice-btn" style="width: 50px; height: 50px;" onclick="startVoice()">
                                <i class="fas fa-microphone"></i>
                            </button>
                        </div>
                        <button class="btn btn-primary w-100 py-3 rounded-4 fw-bold" onclick="analyzeText()">ANALYZE CLAIM</button>
                    </div>

                    <!-- URL Tab -->
                    <div class="tab-pane fade" id="tab-url">
                        <input type="url" id="url-input" class="form-control mb-3" placeholder="https://news-site.com/article-to-check">
                        <button class="btn btn-primary w-100 py-3 rounded-4 fw-bold" onclick="analyzeUrl()">SCRAPE & ANALYZE</button>
                    </div>

                    <!-- Document Tab -->
                    <div class="tab-pane fade" id="tab-doc">
                        <div class="dropzone mb-3" onclick="document.getElementById('doc-file').click()">
                            <i class="fas fa-file-arrow-up fa-2x mb-2 text-primary"></i>
                            <h6>Drop PDF or Word document</h6>
                            <input type="file" id="doc-file" hidden onchange="analyzeDoc()" accept=".pdf,.docx">
                        </div>
                    </div>

                    <!-- Image Tab -->
                    <div class="tab-pane fade" id="tab-image">
                        <div class="dropzone mb-3" onclick="document.getElementById('img-file').click()">
                            <i class="fas fa-image fa-2x mb-2 text-primary"></i>
                            <h6>Drop image for AI analysis</h6>
                            <input type="file" id="img-file" hidden onchange="analyzeImage()" accept="image/*">
                        </div>
                    </div>
                </div>
            </div>

            <!-- RESULT AREA -->
            <div id="result-area" class="d-none">
                <div class="glass-card" id="badge-to-capture">
                    <div class="d-flex justify-content-between">
                        <div>
                            <h4 class="outfit mb-1" id="res-verdict">Analysis Results</h4>
                            <div id="res-badge"></div>
                        </div>
                        <div class="chart-container">
                            <canvas id="gaugeChart"></canvas>
                        </div>
                    </div>

                    <div class="mt-4">
                        <h6 class="text-muted small fw-bold">AI INSIGHT</h6>
                        <p id="res-analysis" class="lh-lg"></p>
                    </div>

                    <div class="mt-4">
                        <h6 class="text-muted small fw-bold">EVIDENCE & CITATIONS</h6>
                        <div id="res-sources" class="lh-sm small opacity-75"></div>
                    </div>

                    <div class="mt-4 pt-3 border-top border-opacity-10 d-flex gap-2">
                        <button class="btn btn-success btn-sm rounded-pill px-3" onclick="downloadBadge()">
                            <i class="fas fa-certificate me-1"></i> Download Verified Badge
                        </button>
                        <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="share()">
                            <i class="fas fa-share me-1"></i> Share
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT: Trending & Logs -->
        <aside>
            <!-- Trending -->
            <div class="glass-card mb-4" style="background: rgba(99, 102, 241, 0.05)">
                <h5 class="outfit mb-3"><i class="fas fa-fire text-warning me-2"></i>Trending Checks</h5>
                <div id="trending-list" class="small">
                    <!-- Dynamic -->
                </div>
            </div>

            <!-- History -->
            <div class="glass-card">
                <h5 class="outfit mb-3">Recent Logs</h5>
                <div id="history-list">
                    <!-- Dynamic -->
                </div>
            </div>
        </aside>
    </div>
</div>

<script>
    let gaugeChart = null;

    // 🏗 UI Helpers
    function showLoader(show) { document.getElementById("loading").style.display = show ? "flex" : "none"; }
    
    function initGauge(score) {
        const ctx = document.getElementById('gaugeChart').getContext('2d');
        if (gaugeChart) gaugeChart.destroy();
        
        gaugeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [score * 100, 100 - (score * 100)],
                    backgroundColor: [score > 0.6 ? '#10b981' : '#ef4444', '#1e293b'],
                    borderWidth: 0,
                    circumference: 180,
                    rotation: 270,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '80%',
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });
    }

    // 🎙 Voice Recognition
    function startVoice() {
        const btn = document.getElementById('voice-btn');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        
        recognition.onstart = () => btn.classList.add('recording');
        recognition.onend = () => btn.classList.remove('recording');
        recognition.onresult = (event) => {
            document.getElementById('text-input').value = event.results[0][0].transcript;
        };
        recognition.start();
    }

    // 🔍 Analysis Logic
    async function apiCall(endpoint, body, isFile = false) {
        showLoader(true);
        try {
            const options = { method: 'POST' };
            if (isFile) {
                options.body = body;
            } else {
                options.headers = { 'Content-Type': 'application/json' };
                options.body = JSON.stringify(body);
            }
            
            const res = await fetch(`http://127.0.0.1:8000/${endpoint}`, options);
            const data = await res.json();
            displayResults(data);
            updateTrending();
        } catch (e) {
            alert("Error connecting to AI Server.");
        } finally {
            showLoader(false);
        }
    }

    function analyzeText() { apiCall('predict', { text: document.getElementById('text-input').value }); }
    function analyzeUrl() { apiCall('analyze-url', { url: document.getElementById('url-input').value }); }
    function analyzeDoc() { 
        const formData = new FormData();
        formData.append('file', document.getElementById('doc-file').files[0]);
        apiCall('analyze-doc', formData, true);
    }
    function analyzeImage() {
        const formData = new FormData();
        formData.append('file', document.getElementById('img-file').files[0]);
        apiCall('predict-image', formData, true);
    }

    function displayResults(data) {
        document.getElementById('result-area').classList.remove('d-none');
        const isFake = data.prediction.toLowerCase().includes('fake');
        
        document.getElementById('res-verdict').innerText = data.prediction;
        document.getElementById('res-verdict').style.color = isFake ? 'var(--accent-fake)' : 'var(--accent-real)';
        document.getElementById('res-analysis').innerText = data.ai_analysis || "AI image classification complete.";
        document.getElementById('res-sources').innerText = data.sources || "Direct multimodal analysis - No external citations needed.";
        
        initGauge(data.confidence || 0.8);
        saveHistory(data);
    }

    // 💾 State Management
    async function updateTrending() {
        const res = await fetch('http://127.0.0.1:8000/trending');
        const data = await res.json();
        const list = document.getElementById('trending-list');
        list.innerHTML = data.map(t => `
            <div class="mb-2 p-2 border-bottom border-white border-opacity-10">
                <div class="fw-bold" style="color: ${t.prediction.includes('Fake') ? 'var(--accent-fake)' : 'var(--accent-real)'}">${t.prediction}</div>
                <div class="text-truncate opacity-50">${t.text}</div>
            </div>
        `).join('');
    }

    function saveHistory(data) {
        let history = JSON.parse(localStorage.getItem("fact_history_v2") || "[]");
        history.unshift({ ...data, date: new Date().toLocaleTimeString() });
        localStorage.setItem("fact_history_v2", JSON.stringify(history.slice(0, 10)));
        loadHistory();
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem("fact_history_v2") || "[]");
        document.getElementById('history-list').innerHTML = history.map(h => `
            <div class="p-2 small border-bottom border-white border-opacity-5">
                <span class="fw-bold" style="color: ${h.prediction.includes('Fake') ? 'var(--accent-fake)' : 'var(--accent-real)'}">${h.prediction}</span>
                <span class="opacity-50 float-end">${h.date}</span>
            </div>
        `).join('');
    }

    // 🏆 Utilities
    function downloadBadge() {
        html2canvas(document.querySelector("#badge-to-capture")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'verified-fact-badge.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    function share() {
        navigator.share ? navigator.share({ title: 'AI Fact Check', text: 'Check out this analysis!', url: location.href }) : alert("Share not supported");
    }

    // Initial
    loadHistory();
    updateTrending();
    setInterval(updateTrending, 10000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
